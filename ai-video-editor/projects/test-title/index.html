<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0d0f14;
        --ink: #f5f3ee;
        --accent: #ffcc33;
        --font-display: "DejaVu Sans", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
      #card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        font-family: var(--font-display);
      }
      #title {
        color: var(--ink);
        font-size: 120px;
        font-weight: 800;
        line-height: 1.05;
        text-align: center;
        letter-spacing: -0.03em;
      }
      #bar {
        width: 360px;
        height: 14px;
        border-radius: 7px;
        background: var(--accent);
        transform-origin: left center;
      }
      #sub {
        color: var(--accent);
        font-size: 64px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <div id="card" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <h1 id="title">AI Video<br />Editor</h1>
        <div id="bar"></div>
        <p id="sub">Setup ready ✓</p>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.8);
      tl.fromTo("#sub", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 1.3);
      tl.fromTo("#title", { scale: 1 }, { scale: 1.06, duration: 3, ease: "none" }, 1.8);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
