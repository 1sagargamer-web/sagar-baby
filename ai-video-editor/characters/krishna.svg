<svg id="kr" viewBox="0 0 600 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Bhagwan (Krishna ji), v2 semi-realistic, matches the Sagar character. Original design for this channel.
       Part ids used by the builder: kr-eyes-(open|closed|half), kr-mouth-(closed|open), kr-head, kr-body, kr-halo -->
  <defs>
    <radialGradient id="kr-halo-g">
      <stop offset="0" stop-color="#fff8d6" stop-opacity="0.95" />
      <stop offset="0.55" stop-color="#ffd35c" stop-opacity="0.5" />
      <stop offset="1" stop-color="#ffd35c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="kr-skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a9ee6" />
      <stop offset="0.55" stop-color="#5a8fdc" />
      <stop offset="1" stop-color="#4373c2" />
    </linearGradient>
    <linearGradient id="kr-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe07a" />
      <stop offset="0.6" stop-color="#f2b632" />
      <stop offset="1" stop-color="#c98a1c" />
    </linearGradient>
    <linearGradient id="kr-silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd94d" />
      <stop offset="1" stop-color="#e9a91c" />
    </linearGradient>
    <linearGradient id="kr-sash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a45" />
      <stop offset="1" stop-color="#e0661f" />
    </linearGradient>
    <filter id="kr-soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2" /></filter>
  </defs>
  <circle id="kr-halo" cx="300" cy="400" r="300" fill="url(#kr-halo-g)" />

  <g id="kr-body" stroke-linejoin="round" stroke-linecap="round">
    <!-- long hair behind, wavy ends -->
    <path d="M176 380 C150 470 146 560 166 650 C172 676 188 700 204 716 C214 700 226 708 236 720 L364 720 C374 708 386 700 396 716 C412 700 428 676 434 650 C454 560 450 470 424 380 Z" fill="#17142a" />
    <path d="M170 560 C178 600 188 640 204 680 M430 560 C422 600 412 640 396 680" fill="none" stroke="#3a3560" stroke-width="4" />
    <!-- chest -->
    <path d="M120 1000 C122 760 180 640 300 628 C420 640 478 760 480 1000 Z" fill="url(#kr-skin)" stroke="#1b2a4a" stroke-width="4" />
    <path d="M440 760 C460 840 470 920 474 1000 L420 1000 C430 920 432 840 418 770 Z" fill="#3a67b3" opacity="0.6" />
    <!-- neck -->
    <path d="M262 530 L262 622 Q300 652 338 622 L338 530 Z" fill="#5a8fdc" stroke="#1b2a4a" stroke-width="4" />
    <path d="M262 548 Q300 606 338 548 L338 592 Q300 622 262 592 Z" fill="#3a67b3" opacity="0.6" />
    <!-- pitambar -->
    <path d="M130 872 C220 892 380 892 470 872 L480 1000 L120 1000 Z" fill="url(#kr-silk)" stroke="#8a5a12" stroke-width="4" />
    <path d="M220 900 C230 940 226 970 232 1000 M300 904 C306 944 300 972 306 1000 M380 900 C372 940 378 970 370 1000" fill="none" stroke="#c98a1c" stroke-width="3" opacity="0.7" />
    <!-- sash (angavastram) -->
    <path d="M196 640 C252 756 352 830 456 846 L450 900 C338 880 230 806 170 684 Z" fill="url(#kr-sash)" stroke="#9c4512" stroke-width="4" />
    <path d="M206 668 C262 768 350 828 448 860" fill="none" stroke="#ffc08a" stroke-width="3" opacity="0.7" />
    <!-- flute -->
    <g transform="rotate(-14 330 905)">
      <rect x="215" y="893" width="230" height="22" rx="11" fill="#9a5a2c" stroke="#4e2a12" stroke-width="3" />
      <rect x="236" y="893" width="10" height="22" fill="#e2453c" />
      <rect x="420" y="893" width="10" height="22" fill="#e2453c" />
      <circle cx="300" cy="904" r="4" fill="#3b2412" />
      <circle cx="330" cy="904" r="4" fill="#3b2412" />
      <circle cx="360" cy="904" r="4" fill="#3b2412" />
    </g>
    <!-- necklaces -->
    <path d="M240 630 C262 690 338 690 360 630" fill="none" stroke="url(#kr-gold)" stroke-width="10" />
    <path d="M226 640 C250 740 350 740 374 640" fill="none" stroke="#f4f0e6" stroke-width="7" stroke-dasharray="1 9" />
    <circle cx="300" cy="684" r="12" fill="#e2453c" stroke="#a3601a" stroke-width="3" />
  </g>

  <g id="kr-head" stroke-linejoin="round" stroke-linecap="round">
    <!-- ears + earrings -->
    <path d="M190 392 C164 382 154 420 166 450 C174 470 188 474 196 460 Z" fill="#5a8fdc" stroke="#1b2a4a" stroke-width="4" />
    <path d="M410 392 C436 382 446 420 434 450 C426 470 412 474 404 460 Z" fill="#4373c2" stroke="#1b2a4a" stroke-width="4" />
    <path d="M172 470 C160 490 164 512 178 520 C192 512 194 490 182 470 Z" fill="url(#kr-gold)" stroke="#a3601a" stroke-width="3" />
    <path d="M428 470 C440 490 436 512 422 520 C408 512 406 490 418 470 Z" fill="url(#kr-gold)" stroke="#a3601a" stroke-width="3" />
    <!-- face -->
    <path d="M184 398 C184 300 236 262 300 262 C364 262 416 300 416 398 C416 470 400 516 370 544 C348 564 326 572 300 572 C274 572 252 564 230 544 C200 516 184 470 184 398 Z" fill="url(#kr-skin)" stroke="#1b2a4a" stroke-width="4" />
    <path d="M416 398 C416 470 400 516 370 544 C348 564 326 572 300 572 C344 552 380 514 392 450 C398 414 398 368 392 336 C408 356 416 376 416 398 Z" fill="#3a67b3" opacity="0.5" />
    <ellipse cx="228" cy="472" rx="22" ry="12" fill="#f39bb0" opacity="0.3" />
    <ellipse cx="372" cy="472" rx="22" ry="12" fill="#f39bb0" opacity="0.3" />
    <!-- hair front: centre parting, soft waves -->
    <path d="M180 410 C172 330 214 284 300 284 C386 284 428 330 420 410 C410 364 380 338 340 334 C326 346 312 350 300 346 C288 350 274 346 260 334 C220 338 190 364 180 410 Z" fill="#17142a" />
    <path d="M300 300 C284 318 266 330 244 338 M300 300 C316 318 334 330 356 338" fill="none" stroke="#3a3560" stroke-width="4" />
    <!-- crown -->
    <path d="M190 334 L410 334 L402 296 L198 296 Z" fill="url(#kr-gold)" stroke="#a3601a" stroke-width="4" />
    <path d="M198 296 L220 240 L246 296 L272 224 L300 190 L328 224 L354 296 L380 240 L402 296 Z" fill="url(#kr-gold)" stroke="#a3601a" stroke-width="4" />
    <path d="M206 316 L394 316" fill="none" stroke="#fff1b8" stroke-width="3" stroke-dasharray="2 10" />
    <circle cx="300" cy="262" r="15" fill="#e2453c" stroke="#a3601a" stroke-width="4" />
    <circle cx="296" cy="257" r="4" fill="#ff9c94" />
    <circle cx="246" cy="276" r="7" fill="#2f9e5b" stroke="#a3601a" stroke-width="2" />
    <circle cx="354" cy="276" r="7" fill="#2f9e5b" stroke="#a3601a" stroke-width="2" />
    <!-- peacock feather -->
    <path d="M356 250 C372 210 386 170 400 128" fill="none" stroke="#2c6b3f" stroke-width="5" />
    <g transform="rotate(18 404 128)">
      <ellipse cx="404" cy="128" rx="30" ry="54" fill="#2f9e5b" stroke="#1d5a35" stroke-width="4" />
      <path d="M404 78 L404 180 M384 100 L404 128 M424 100 L404 128 M380 140 L404 128 M428 140 L404 128" fill="none" stroke="#5fc183" stroke-width="2" />
      <ellipse cx="404" cy="122" rx="17" ry="26" fill="#1f5fbf" stroke="#f2b632" stroke-width="4" />
      <ellipse cx="404" cy="120" rx="7" ry="11" fill="#0f2350" />
    </g>
    <!-- tilak -->
    <path d="M287 354 L293 388 L307 388 L313 354" fill="none" stroke="#fff4dc" stroke-width="6" />
    <path d="M300 358 L300 384" fill="none" stroke="#e2453c" stroke-width="5" />
    <!-- brows: calm arches -->
    <path d="M214 396 C230 384 256 380 282 388 C282 392 280 394 276 394 C254 390 234 392 218 402 C212 404 210 400 214 396 Z" fill="#17142a" />
    <path d="M386 396 C370 384 344 380 318 388 C318 392 320 394 324 394 C346 390 366 392 382 402 C388 404 390 400 386 396 Z" fill="#17142a" />
    <!-- eyes: lotus-shaped -->
    <g id="kr-eyes-open">
      <path d="M222 428 Q250 404 282 424 Q252 440 222 428 Z" fill="#fbf7f2" />
      <path d="M378 428 Q350 404 318 424 Q348 440 378 428 Z" fill="#fbf7f2" />
      <circle cx="252" cy="424" r="11" fill="#2a1a3a" />
      <circle cx="348" cy="424" r="11" fill="#2a1a3a" />
      <circle cx="252" cy="424" r="5" fill="#0d0814" />
      <circle cx="348" cy="424" r="5" fill="#0d0814" />
      <circle cx="256" cy="420" r="3.2" fill="#ffffff" />
      <circle cx="352" cy="420" r="3.2" fill="#ffffff" />
      <path d="M218 428 Q250 400 286 424 L292 418" fill="none" stroke="#0f0b1c" stroke-width="5" />
      <path d="M382 428 Q350 400 314 424 L308 418" fill="none" stroke="#0f0b1c" stroke-width="5" />
      <path d="M228 432 Q252 440 278 428" fill="none" stroke="#2e5aa0" stroke-width="2" />
      <path d="M372 432 Q348 440 322 428" fill="none" stroke="#2e5aa0" stroke-width="2" />
    </g>
    <g id="kr-eyes-half" opacity="0">
      <path d="M222 428 Q252 420 282 424 Q252 440 222 428 Z" fill="#fbf7f2" />
      <path d="M378 428 Q348 420 318 424 Q348 440 378 428 Z" fill="#fbf7f2" />
      <circle cx="254" cy="430" r="8" fill="#2a1a3a" />
      <circle cx="350" cy="430" r="8" fill="#2a1a3a" />
      <path d="M216 426 Q252 414 290 422" fill="none" stroke="#0f0b1c" stroke-width="6" />
      <path d="M384 426 Q348 414 310 422" fill="none" stroke="#0f0b1c" stroke-width="6" />
    </g>
    <g id="kr-eyes-closed" opacity="0" fill="none" stroke="#0f0b1c" stroke-width="5">
      <path d="M222 426 Q252 440 284 424" />
      <path d="M378 426 Q348 440 316 424" />
      <path d="M232 432 L228 440 M246 436 L244 444 M368 432 L372 440 M354 436 L356 444" stroke-width="2.5" />
    </g>
    <g id="kr-eyes-wink" opacity="0">
      <path d="M222 428 Q250 404 282 424 Q252 440 222 428 Z" fill="#fbf7f2" /><circle cx="252" cy="424" r="11" fill="#2a1a3a" /><circle cx="252" cy="424" r="5" fill="#0d0814" /><circle cx="256" cy="420" r="3.2" fill="#ffffff" />
      <path d="M218 428 Q250 400 286 424" fill="none" stroke="#0f0b1c" stroke-width="5" />
      <path d="M322 428 Q348 446 378 428" fill="none" stroke="#0f0b1c" stroke-width="6" stroke-linecap="round" />
    </g>
    <!-- nose -->
    <path d="M290 426 C288 448 282 462 284 470" fill="none" stroke="#3a67b3" stroke-width="3" opacity="0.8" />
    <ellipse cx="304" cy="456" rx="5" ry="10" fill="#ffffff" opacity="0.2" />
    <path d="M280 468 Q300 482 320 468" fill="none" stroke="#24447e" stroke-width="4" />
    <!-- mouth: gentle smile -->
    <g id="kr-mouth-closed">
      <path d="M276 506 Q300 524 324 506 Q300 514 276 506 Z" fill="#c25a7a" opacity="0.85" />
      <path d="M266 500 Q300 516 334 500" fill="none" stroke="#1b2a4a" stroke-width="4" />
    </g>
    <g id="kr-mouth-open" opacity="0">
      <path d="M270 500 Q300 494 330 500 Q326 540 300 544 Q274 540 270 500 Z" fill="#4a1430" stroke="#1b2a4a" stroke-width="3" />
      <path d="M275 502 Q300 498 325 502 L323 511 Q300 509 277 511 Z" fill="#ffffff" />
      <ellipse cx="300" cy="533" rx="14" ry="6" fill="#d86a88" />
    </g>
  </g>
</svg>
