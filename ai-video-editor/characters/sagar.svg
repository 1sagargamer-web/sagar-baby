<svg id="sg" viewBox="0 0 600 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Sagar (the owner), v2 semi-realistic, from his photos: messy fringe, thick brows, brown eyes,
       trimmed beard, white tee + navy leather jacket. Part ids used by the builder:
       sg-eyes-(open|closed|shock), sg-brows-(normal|sad|angry), sg-mouth-(closed|open|o|sad|smirk),
       sg-arms-(pray|thumb), sg-sweat, sg-tears, sg-head, sg-body -->
  <defs>
    <filter id="sg-soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2" /></filter>
    <filter id="sg-softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" /></filter>
    <linearGradient id="sg-skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1c6a3" />
      <stop offset="0.55" stop-color="#ecbd98" />
      <stop offset="1" stop-color="#dba582" />
    </linearGradient>
    <linearGradient id="sg-jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3651" />
      <stop offset="1" stop-color="#1b2133" />
    </linearGradient>
    <linearGradient id="sg-tee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf6" />
      <stop offset="1" stop-color="#e6e3da" />
    </linearGradient>
  </defs>

  <g id="sg-body" stroke-linejoin="round" stroke-linecap="round">
