    <path d="M262 548 Q300 606 338 548 L338 592 Q300 622 262 592 Z" fill="#c78a67" opacity="0.65" />
    <path d="M258 628 Q300 664 342 628" fill="none" stroke="#dcd8cc" stroke-width="10" />
    <!-- jacket -->
    <path d="M120 1000 C122 760 168 650 250 624 L272 700 L254 780 L246 1000 Z" fill="url(#sg-jacket)" stroke="#11151f" stroke-width="4" />
    <path d="M480 1000 C478 760 432 650 350 624 L328 700 L346 780 L354 1000 Z" fill="url(#sg-jacket)" stroke="#11151f" stroke-width="4" />
    <path d="M250 624 L214 714 L272 700 Z" fill="#35415f" stroke="#11151f" stroke-width="4" />
    <path d="M350 624 L386 714 L328 700 Z" fill="#35415f" stroke="#11151f" stroke-width="4" />
    <path d="M152 800 C148 860 148 920 152 984" fill="none" stroke="#6b7aa0" stroke-width="7" opacity="0.55" />
    <path d="M184 700 C174 732 168 764 166 796" fill="none" stroke="#7d8cb2" stroke-width="5" opacity="0.5" />
    <path d="M448 800 C452 860 452 920 448 984" fill="none" stroke="#3f4b6b" stroke-width="6" opacity="0.6" />
    <path d="M251 782 L244 1000" fill="none" stroke="#a9b2c6" stroke-width="3" stroke-dasharray="5 6" />
  </g>

  <g id="sg-arms-pray" opacity="0" stroke="#11151f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
