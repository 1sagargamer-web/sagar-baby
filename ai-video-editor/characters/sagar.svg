    <path d="M212 266 C214 230 236 212 256 236 C260 204 288 192 302 226 C316 196 344 198 348 232 C366 212 392 226 390 258 Z" fill="#1d1916" />
    <path d="M166 410 C146 304 196 232 296 226 C394 220 458 280 440 396 C432 356 414 332 396 322 C382 352 352 364 322 362 C302 370 262 376 232 370 C206 370 184 386 166 410 Z" fill="#1d1916" />
