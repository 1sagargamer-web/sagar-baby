    <ellipse cx="176" cy="436" rx="18" ry="30" fill="#efc3a0" />
    <ellipse cx="424" cy="436" rx="18" ry="30" fill="#efc3a0" />
    <!-- face with a slightly narrow chin -->
    <path d="M176 414 C176 304 230 280 300 280 C370 280 424 304 424 414 C424 502 382 560 300 566 C218 560 176 502 176 414 Z" fill="#efc3a0" />
