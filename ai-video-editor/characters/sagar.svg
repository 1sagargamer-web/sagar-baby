<svg id="sg" viewBox="0 0 600 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Sagar (the owner), drawn from his photos: messy fringe, thick brows, trimmed beard,
       white tee + navy leather jacket, thumbs-up. Part ids used by the builder:
       sg-eyes-(open|closed|shock), sg-brows-(normal|sad|angry), sg-mouth-(closed|open|o|sad|smirk),
       sg-arms-(pray|thumb), sg-sweat, sg-tears, sg-head, sg-body -->
  <g id="sg-body" stroke="#231812" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- white tee -->
    <path d="M140 1000 C140 740 190 610 300 600 C410 610 460 740 460 1000 Z" fill="#f6f5ef" />
    <!-- neck -->
    <rect x="268" y="536" width="64" height="84" rx="24" fill="#efc3a0" />
    <path d="M254 604 Q300 646 346 604" fill="#efc3a0" />
    <path d="M250 606 Q300 656 350 606" fill="none" stroke="#d9d6cc" stroke-width="10" />
    <!-- leather jacket, open -->
    <path d="M140 1000 C140 742 186 618 252 604 L268 690 L246 760 L236 1000 Z" fill="#26304a" />
    <path d="M460 1000 C460 742 414 618 348 604 L332 690 L354 760 L364 1000 Z" fill="#26304a" />
    <path d="M252 604 L222 700 L268 690 Z" fill="#323d5c" />
    <path d="M348 604 L378 700 L332 690 Z" fill="#323d5c" />
    <path d="M242 772 L234 1000" fill="none" stroke="#9aa3b8" stroke-width="4" stroke-dasharray="7 7" />
    <path d="M178 780 C170 860 166 930 170 1000" fill="none" stroke="#3b4768" stroke-width="5" />
    <path d="M422 780 C430 860 434 930 430 1000" fill="none" stroke="#3b4768" stroke-width="5" />
  </g>
  <g id="sg-arms-pray" opacity="0" stroke="#231812" stroke-width="6" stroke-linejoin="round">
    <path d="M168 760 C186 884 258 904 296 852 L296 770 C268 808 228 806 204 742 Z" fill="#26304a" />
    <path d="M432 760 C414 884 342 904 304 852 L304 770 C332 808 372 806 396 742 Z" fill="#26304a" />
    <path d="M280 866 C272 800 284 728 300 710 C316 728 328 800 320 866 Z" fill="#efc3a0" />
    <path d="M300 718 L300 864" fill="none" />
  </g>
  <g id="sg-arms-thumb" opacity="0" stroke="#231812" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M436 760 C428 850 392 878 344 852 L332 782 C364 800 392 784 404 736 Z" fill="#26304a" />
    <path d="M268 790 h70 a20 20 0 0 1 20 20 v40 a20 20 0 0 1 -20 20 h-70 a20 20 0 0 1 -20 -20 v-40 a20 20 0 0 1 20 -20 Z" fill="#efc3a0" />
    <path d="M262 818 L340 818 M262 842 L336 842" fill="none" stroke-width="4" />
    <path d="M276 792 C270 756 274 720 292 712 C308 706 314 720 310 738 L306 792 Z" fill="#efc3a0" />
  </g>
  <g id="sg-head" stroke="#231812" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
