      <path d="M326 434 Q350 410 374 434 Q350 450 326 434 Z" fill="#ffffff" />
      <circle cx="252" cy="433" r="11" fill="#2a1a10" stroke="none" />
      <circle cx="352" cy="433" r="11" fill="#2a1a10" stroke="none" />
      <circle cx="256" cy="429" r="3.5" fill="#ffffff" stroke="none" />
      <circle cx="356" cy="429" r="3.5" fill="#ffffff" stroke="none" />
    </g>
    <g id="sg-eyes-closed" opacity="0" fill="none">
