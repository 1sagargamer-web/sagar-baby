    <ellipse id="sg-mouth-o" opacity="0" cx="300" cy="522" rx="16" ry="22" fill="#6b1e24" />
    <path id="sg-mouth-sad" opacity="0" d="M276 524 Q300 506 324 524" fill="none" />
    <path id="sg-mouth-smirk" opacity="0" d="M274 514 Q304 522 330 502" fill="none" />
    <!-- sweat + tears -->
    <path id="sg-sweat" opacity="0" d="M448 318 C464 346 470 362 458 374 C448 382 434 374 436 360 C438 346 444 334 448 318 Z" fill="#8fd3ff" stroke="#3a7fb0" stroke-width="4" />
    <g id="sg-tears" opacity="0" fill="#8fd3ff" stroke="#3a7fb0" stroke-width="4">
      <path d="M236 452 C244 470 248 482 240 490 C232 496 222 488 226 478 C228 470 232 462 236 452 Z" />
      <path d="M364 452 C372 470 376 482 368 490 C360 496 350 488 354 478 C356 470 360 462 364 452 Z" />
    </g>
