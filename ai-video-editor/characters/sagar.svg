      <path d="M326 436 Q350 450 374 436" />
    </g>
    <g id="sg-eyes-shock" opacity="0">
      <ellipse cx="248" cy="432" rx="30" ry="33" fill="#ffffff" />
      <ellipse cx="352" cy="432" rx="30" ry="33" fill="#ffffff" />
      <circle cx="248" cy="434" r="6" fill="#2a1a10" stroke="none" />
      <circle cx="352" cy="434" r="6" fill="#2a1a10" stroke="none" />
    </g>
    <!-- nose -->
    <path d="M296 442 Q284 478 300 486 Q312 484 316 476" fill="none" stroke-width="5" />
    <!-- moustache -->
    <path d="M258 500 Q300 480 342 500 Q322 494 300 497 Q278 494 258 500 Z" fill="#241a15" stroke="none" opacity="0.85" />
