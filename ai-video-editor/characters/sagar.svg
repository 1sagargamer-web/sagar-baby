    <path id="sg-mouth-closed" d="M274 512 Q300 524 326 512" fill="none" />
    <g id="sg-mouth-open" opacity="0">
      <path d="M270 506 Q300 556 330 506 Q300 516 270 506 Z" fill="#6b1e24" />
      <path d="M286 532 Q300 546 314 532 Q300 526 286 532 Z" fill="#e8677b" stroke="none" />
