name: Build Sagar Vaani APK

# Har push pe naya APK banta hai.
#  - main branch  -> "Latest" release (users ka update link isi pe hai)
#  - baaki branch -> pre-release (testing ke liye)
on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Signing key (GitHub secrets se)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            echo "Release key mili ✓"
          else
            echo "::warning::KEYSTORE_BASE64 secret nahi hai - debug key se sign ho raha hai (update install mein dikkat aayegi)"
          fi

      - name: Firebase + server config (GitHub secrets se)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
        run: |
          DEFINES=""
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > /tmp/gs.json
            PKG=com.sagar.sagar_vaani
            CLIENT=$(jq -c --arg p "$PKG" '[.client[] | select(.client_info.android_client_info.package_name==$p)][0] // .client[0]' /tmp/gs.json)
            DEFINES="$DEFINES --dart-define=FB_API_KEY=$(echo "$CLIENT" | jq -r '.api_key[0].current_key')"
            DEFINES="$DEFINES --dart-define=FB_APP_ID=$(echo "$CLIENT" | jq -r '.client_info.mobilesdk_app_id')"
            DEFINES="$DEFINES --dart-define=FB_SENDER_ID=$(jq -r '.project_info.project_number' /tmp/gs.json)"
            DEFINES="$DEFINES --dart-define=FB_PROJECT_ID=$(jq -r '.project_info.project_id' /tmp/gs.json)"
            DEFINES="$DEFINES --dart-define=FB_STORAGE_BUCKET=$(jq -r '.project_info.storage_bucket // ""' /tmp/gs.json)"
            rm /tmp/gs.json
            echo "Firebase config mila ✓"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret nahi hai - login/owner panel band rahega"
          fi
          if [ -n "$SERVER_URL" ]; then DEFINES="$DEFINES --dart-define=SERVER_URL=$SERVER_URL"; fi
          echo "DEFINES=$DEFINES" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} $DEFINES
          cp build/app/outputs/flutter-apk/app-release.apk SagarVaani.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SagarVaani-${{ github.run_number }}
          path: app/SagarVaani.apk

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sagar Vaani v1.0.${{ github.run_number }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          body: |
            Build number: **${{ github.run_number }}**
            Owner panel → App Update → "Latest build no." mein `${{ github.run_number }}` daalo, sab users ko update dikh jayega.
          files: app/SagarVaani.apk
