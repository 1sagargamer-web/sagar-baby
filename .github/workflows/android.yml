name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk ../out/VideoDownloader-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk ../out/VideoDownloader-arm32.apk
          ls -lh ../out

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Video Downloader v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*.apk
          body: |
            **Kaunsa APK download karein?**
            - `VideoDownloader-arm64.apk` — zyadatar phones (2017 ke baad wale). **Yahi pehle try karo.**
            - `VideoDownloader-arm32.apk` — sirf agar arm64 install na ho (bahut purane phones).

            Install karte waqt "Unknown sources / Install unknown apps" allow karna padega.
